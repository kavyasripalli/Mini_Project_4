<div class="profile-page">

  <div class="background-overlay"></div>

  <div class="profile-card">

    <!-- Header -->

    <div class="profile-header text-center">

      <div class="profile-icon">
        <i class="bi bi-person-heart"></i>
      </div>

      <h1>Complete Your Profile</h1>

      <p>
        Join our healthcare network as a registered patient.
      </p>

    </div>

    <!-- Form -->

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="profile-form"
    >

      <!-- Name -->

      <div class="input-group-custom">

        <label>Full Name</label>

        <div class="input-wrapper">

          <i class="bi bi-person-fill"></i>

          <input
            type="text"
            placeholder="Enter your full name"
            formControlName="name"
            [readOnly]="auth.role === 'Patient'"
          />

        </div>

        <small
          class="info-text"
          *ngIf="auth.role === 'Patient'"
        >
          Identity locked for patient security
        </small>

      </div>

      <!-- Age -->

      <div class="input-group-custom">

        <label>Age</label>

        <div class="input-wrapper">

          <i class="bi bi-calendar2-heart-fill"></i>

          <input
            type="number"
            placeholder="Enter your age"
            formControlName="age"
          />

        </div>

      </div>

      <!-- Gender -->

      <div class="input-group-custom">

        <label>Gender</label>

        <div class="input-wrapper">

          <i class="bi bi-gender-ambiguous"></i>

          <select formControlName="gender">

            <option value="">
              Select Gender
            </option>

            <option value="Male">
              Male
            </option>

            <option value="Female">
              Female
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>

      </div>

      <!-- Phone -->

      <div class="input-group-custom">

        <label>Phone Number</label>

        <div class="input-wrapper">

          <i class="bi bi-telephone-fill"></i>

          <input
            type="text"
            placeholder="Enter your phone number"
            formControlName="phoneNumber"
          />

        </div>

      </div>

      <!-- Email -->

      <div class="input-group-custom">

        <label>Email Address</label>

        <div class="input-wrapper">

          <i class="bi bi-envelope-fill"></i>

          <input
            type="email"
            placeholder="Enter your email"
            formControlName="email"
          />

        </div>

      </div>

      <!-- Submit Button -->

      <button
        type="submit"
        class="profile-btn"
        [disabled]="form.invalid || loading"
      >

        <span *ngIf="!loading">

          <i class="bi bi-heart-pulse-fill me-2"></i>

          Create Medical Profile

        </span>

        <span *ngIf="loading">

          <span class="spinner-border spinner-border-sm me-2"></span>

          Saving Profile...

        </span>

      </button>

      <!-- Message -->

      <div
        class="message-box success"
        *ngIf="message.includes('✅')"
      >
        {{ message }}
      </div>

      <div
        class="message-box error"
        *ngIf="message && !message.includes('✅')"
      >
        {{ message }}
      </div>

    </form>

    <!-- Footer -->

    <div class="footer-section text-center">

      <a
        *ngIf="auth.role === 'Patient'"
        routerLink="/Patient/view-profile"
        class="back-link"
      >
        ← Back to Profile
      </a>

      <a
        *ngIf="auth.role === 'Admin'"
        routerLink="/Admin/view-patients"
        class="back-link"
      >
        ← Back to Patient Management
      </a>

    </div>

  </div>

</div>
